[project]
name = "hermetic-alpha"
version = "0.1.2"
description = "Core Python research engine for astro-financial pattern analysis."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hermetic Alpha Contributors" }]
license = { text = "MIT" }
keywords = [
    "astro-finance",
    "astrology",
    "event-study",
    "market-research",
    "python-library",
]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/wauputr4/hermetic-alpha-library"
Documentation = "https://github.com/wauputr4/hermetic-alpha-library/blob/main/README.md"
Repository = "https://github.com/wauputr4/hermetic-alpha-library"
Issues = "https://github.com/wauputr4/hermetic-alpha-library/issues"
Changelog = "https://github.com/wauputr4/hermetic-alpha-library/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ephemeris = ["pyswisseph>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src"]
testpaths = ["tests"]
